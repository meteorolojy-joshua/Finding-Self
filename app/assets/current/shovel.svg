<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 150">
  <!-- wall bracket plate -->
  <rect x="20" y="6" width="50" height="12" rx="3" fill="#6d7278"/>
  <rect x="20" y="6" width="50" height="12" rx="3" fill="none" stroke="#4f5359" stroke-width="1.5"/>
  <!-- bracket screws -->
  <circle cx="29" cy="12" r="2.8" fill="#43474d"/>
  <circle cx="61" cy="12" r="2.8" fill="#43474d"/>
  <path d="M27.5 12 h3 M59.5 12 h3" stroke="#2b2e33" stroke-width="1.1" stroke-linecap="round"/>
  <!-- hook (behind the handle) -->
  <path d="M45 18 v7 c0 8 13 8 13 -1" fill="none" stroke="#4f5359" stroke-width="5" stroke-linecap="round"/>
  <!-- D-handle grip resting in the hook -->
  <rect x="35" y="23" width="20" height="8" rx="4" fill="#8a5f36"/>
  <rect x="35" y="23" width="20" height="8" rx="4" fill="none" stroke="#6e4a28" stroke-width="1.2"/>
  <!-- handle arms -->
  <path d="M38.5 31 v9 M51.5 31 v9" stroke="#8a5f36" stroke-width="5" stroke-linecap="round"/>
  <!-- wooden shaft -->
  <rect x="42.5" y="38" width="5" height="68" rx="2.5" fill="#a4713e"/>
  <rect x="42.5" y="38" width="5" height="68" rx="2.5" fill="none" stroke="#7d5527" stroke-width="1"/>
  <path d="M44 42 v60" stroke="#c08d54" stroke-width="1.2" opacity=".7"/>
  <!-- blade socket -->
  <path d="M39 104 h12 l3.5 9 h-19 Z" fill="#7c848c"/>
  <path d="M39 104 h12 l3.5 9 h-19 Z" fill="none" stroke="#5f666d" stroke-width="1.2"/>
  <!-- spade blade -->
  <path d="M36.5 112 C34.5 124 37.5 134 45 141 C52.5 134 55.5 124 53.5 112 Z" fill="#9aa3ab"/>
  <path d="M36.5 112 C34.5 124 37.5 134 45 141 C52.5 134 55.5 124 53.5 112 Z" fill="none" stroke="#6e767e" stroke-width="1.5"/>
  <path d="M45 115 v19" stroke="#7c848c" stroke-width="1.4"/>
  <path d="M40 118 c-1 6 0 12 2.5 17 M50 118 c1 6 0 12 -2.5 17" stroke="#b7bec5" stroke-width="1" fill="none" opacity=".8"/>
</svg>
